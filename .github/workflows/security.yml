name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit>=2.9,<3"
      - name: Audit hash-locked production dependencies
        run: python -m pip_audit --requirement backend/requirements.txt --strict

  container-vulnerability-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the backend image
        run: docker build --tag rematch-backend:ci backend
      - name: Scan the image for high and critical vulnerabilities
        run: >-
          docker run --rm
          aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --exit-code 1 --severity HIGH,CRITICAL rematch-backend:ci
