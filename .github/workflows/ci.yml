name: CI

on:
  push:
    branches: [main, master, phase*]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" --disable-pip-version-check
      - name: Test
        run: pytest -q
        env:
          DATABASE_URL: sqlite:///./ci-rematch.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rematch-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rematch-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test -- --run
      - name: Build
        run: npm run build
