identity:
  type: SystemAssigned
properties:
  configuration:
    registries:
      - server: rematchbackend.azurecr.io
        identity: system
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8000
      allowInsecure: false
      transport: auto
      traffic:
        - latestRevision: true
          weight: 100
  template:
    scale:
      minReplicas: 0
      maxReplicas: 1
    containers:
      - name: bootstrap-container-pre-deployment
        image: rematchbackend.azurecr.io/rematch-api:REPLACE_WITH_GIT_SHA
        env:
          - name: APP_ENV
            value: production
          - name: REQUIRE_API_AUTH
            value: "true"
          - name: API_BEARER_TOKEN
            secretRef: api-bearer-token
          - name: DATABASE_URL
            value: sqlite:////tmp/rematch/rematch.db
          - name: PORT
            value: "8000"
          - name: CORS_ORIGINS
            value: "REPLACE_WITH_FRONTEND_ORIGIN"
        resources:
          cpu: 0.5
          memory: 1Gi
        probes:
          - type: Startup
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 10
          - type: Liveness
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          - type: Readiness
            tcpSocket:
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
